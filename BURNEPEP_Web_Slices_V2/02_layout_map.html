: "原图纹理或边沿采样；非无缝贴图。可能带邻近板块局部墨迹。", "png": "png/07_textures/X09_cta-footer-divider.png", "webp": "webp/07_textures/X09_cta-footer-divider.webp"}]};const assets=M.assets;const groups=M.groups;let current=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function toast(s){const t=document.querySelector('#toast');t.textContent=s;t.style.display='block';clearTimeout(window.to);window.to=setTimeout(()=>t.style.display='none',2100)}async function copy(s){try{await navigator.clipboard.writeText(s);toast('已复制路径')}catch{const el=document.createElement('textarea');el.value=s;document.body.appendChild(el);el.select();document.execCommand('copy');el.remove();toast('已复制路径')}}function variant(a){return document.querySelector('#variant')?.value==='alpha'&&a.alpha_png?'alpha':'raw'}function path(a,fmt='png'){return a[(variant(a)==='alpha'?'alpha_':'')+fmt]}function links(a){const p=path(a);return `<a class="btn" href="${esc(p)}" download>PNG</a><a class="btn" href="${esc(path(a,'webp'))}" download>WebP</a><button data-copy="${esc(p)}">复制路径</button>`}document.addEventListener('click',e=>{const c=e.target.closest('[data-copy]');if(c)copy(c.dataset.copy)});for(const [k,v] of Object.entries(groups))document.querySelector('#group').insertAdjacentHTML('beforeend',`<option value="${k}">${esc(v)}</option>`);document.querySelector('#group').value='02_manifesto';function show(a){current=a;document.querySelector('#side').innerHTML=`<span class="tag">${esc(a.group_name)}</span><h2>${a.id} · ${esc(a.name)}</h2><div class="checker" style="text-align:center;padding:10px"><img src="${esc(path(a))}" alt="${esc(a.name)}"></div><p>${a.width} × ${a.height} px</p><div class="links">${links(a)}</div><p class="paths">${esc(path(a))}</p><p class="muted">原图坐标：${a.box.join(', ')}</p><p class="muted">${esc(a.note)}</p><a class="btn" href="01_asset_browser.html">返回素材库</a>`}function render(){const g=document.querySelector('#group').value;for(const [id,offset] of [['#header-map',0],['#body-map',424]]){let rows=assets.filter(a=>a.group===g&&a.id!=='L01'&&(offset===0?a.box[1]<51:a.box[1]>=424));document.querySelector(id+' svg').innerHTML=rows.map(a=>`<rect data-select="${a.id}" x="${a.box[0]}" y="${a.box[1]-offset}" width="${a.width}" height="${a.height}" vector-effect="non-scaling-stroke"><title>${a.id} · ${esc(a.name)}</title></rect>`).join('')}}document.querySelector('#group').onchange=render;document.querySelector('#variant').onchange=()=>{if(current)show(current)};document.addEventListener('click',e=>{const id=e.target.closest('[data-select]')?.dataset.select;if(id)show(assets.find(a=>a.id===id))});render();</script></body></html>
